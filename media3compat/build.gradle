plugins {
    alias libs.plugins.android.library
}

android {
    namespace = 'com.fongmi.media3.compat'
    compileSdk libs.versions.compileSdk.get().toInteger()

    defaultConfig {
        minSdk libs.versions.minSdk.get().toInteger()
    }

    sourceSets {
        main.jniLibs.srcDir("${project.layout.buildDirectory.get()}/generated/libmpv/jniLibs")
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

def libmpvVersion = "2026-04-25"
def libmpvArtifacts = [
        "arm64-v8a"  : [
                file: "app-default-arm64-v8a-release.apk",
                sha256: "4400bcba6be9cec1128e24d1eba153d8727384926b0639fa7fe44d4e36b04f81"
        ],
        "armeabi-v7a": [
                file: "app-default-armeabi-v7a-release.apk",
                sha256: "95a863eddc407f95bb1e5917957d7a9b0e6e290109ee5709b7eb3bc90458a024"
        ],
        "x86_64"     : [
                file: "app-default-x86_64-release.apk",
                sha256: "af240afd26d7110f83ee14a6dbb6c2b451eb1849ea99bb8a27e1928a7df7d873"
        ]
]

def prepareLibmpv = tasks.register("prepareLibmpv") {
    def outputDir = layout.buildDirectory.dir("generated/libmpv/jniLibs")
    outputs.dir(outputDir)
    inputs.property("libmpvVersion", libmpvVersion)
    inputs.properties(libmpvArtifacts.collectEntries { abi, artifact -> [(abi): artifact.sha256] })

    doLast {
        def cacheDir = new File(gradle.gradleUserHomeDir, "caches/fongmi-libmpv/${libmpvVersion}")
        cacheDir.mkdirs()
        libmpvArtifacts.each { abi, artifact ->
            def apk = new File(cacheDir, artifact.file)
            if (!apk.exists() || apk.bytes.digest("SHA-256") != artifact.sha256) {
                apk.delete()
                new URI("https://github.com/mpv-android/mpv-android/releases/download/${libmpvVersion}/${artifact.file}")
                        .toURL().withInputStream { input -> apk.withOutputStream { it << input } }
            }
            def actual = apk.bytes.digest("SHA-256")
            if (actual != artifact.sha256) {
                throw new GradleException("libmpv artifact checksum mismatch for ${artifact.file}")
            }
            copy {
                from zipTree(apk)
                include "lib/${abi}/*.so"
                eachFile { path = path.replaceFirst("lib/", "") }
                includeEmptyDirs = false
                into outputDir
            }
        }
    }
}

tasks.configureEach {
    if (name == "preBuild") dependsOn(prepareLibmpv)
}

dependencies {
    api "androidx.media3:media3-exoplayer:1.10.1"
    api "androidx.media3:media3-exoplayer-dash:1.10.1"
    api "androidx.media3:media3-exoplayer-hls:1.10.1"
    api "androidx.media3:media3-exoplayer-rtsp:1.10.1"
    api "androidx.media3:media3-exoplayer-smoothstreaming:1.10.1"
    api "androidx.media3:media3-session:1.10.1"
    api "androidx.media3:media3-ui:1.10.1"
    api "androidx.media3:media3-ui-danmaku:1.10.1"
    api "androidx.media3:media3-datasource-okhttp:1.10.1"
}
