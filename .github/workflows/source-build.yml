name: Source-only Android build

on:
  workflow_dispatch:
  push:
    branches: [fongmi]
  pull_request:
    branches: [fongmi]

permissions:
  contents: read

jobs:
  leanback-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      FONGMI_NATIVE_ABIS: arm64-v8a

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android native toolchains
        run: sdkmanager "ndk;26.1.10909125" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Cache source-built native libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/fongmi-libmpv
            ~/.gradle/caches/fongmi-ffmpeg-arm64-v8a
          key: native-arm64-${{ runner.os }}-${{ hashFiles('media3compat/scripts/*.sh', 'media3compat/build.gradle') }}

      - name: Verify no APK binary dependency
        run: |
          ! grep -R -E 'FongMi/Release|releases/download/.+\\.apk|zipTree\\(.+apk' \
            media3compat app/build.gradle

      - name: Build debug APK from source
        run: ./gradlew :app:assembleLeanbackArm64_v8aDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: leanback-arm64-source-debug
          path: app/build/outputs/apk/leanbackArm64_v8a/debug/*.apk
          if-no-files-found: error
