name: Source-built player Android release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag for manual runs (for example: v5.5.7-source.1)"
        required: false
        type: string
  push:
    tags: ["v*"]
  pull_request:
    branches: [fongmi]

permissions:
  contents: write

jobs:
  signing:
    runs-on: ubuntu-24.04
    steps:
      - name: Create shared CI release key
        env:
          CI_RELEASE_KEYSTORE_BASE64: ${{ secrets.CI_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$CI_RELEASE_KEYSTORE_BASE64" ]; then
            printf '%s' "$CI_RELEASE_KEYSTORE_BASE64" | base64 --decode > ci-release.keystore
          else
            keytool -genkeypair -noprompt \
              -keystore ci-release.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey -dname "CN=CI" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ci-release-signing
          path: ci-release.keystore
          retention-days: 1

  build:
    needs: signing
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            flavor: Arm64_v8a
            apk_abi: arm64_v8a
          - abi: armeabi-v7a
            flavor: Armeabi_v7a
            apk_abi: armeabi_v7a
          - abi: x86_64
            flavor: X86_64
            apk_abi: x86_64
    env:
      FONGMI_NATIVE_ABIS: ${{ matrix.abi }}
      CI_RELEASE_STORE_PASSWORD: ${{ secrets.CI_RELEASE_STORE_PASSWORD }}
      CI_RELEASE_KEY_ALIAS: ${{ secrets.CI_RELEASE_KEY_ALIAS }}
      CI_RELEASE_KEY_PASSWORD: ${{ secrets.CI_RELEASE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: chaquo/requirements.txt

      - uses: android-actions/setup-android@v3

      - name: Install Android native toolchains
        run: sdkmanager "ndk;26.1.10909125" "ndk;29.0.14206865" "cmake;3.22.1"

      - uses: actions/download-artifact@v4
        with:
          name: ci-release-signing
          path: app

      - name: Configure CI release signing
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "storeFile=ci-release.keystore"
            echo "keyAlias=${CI_RELEASE_KEY_ALIAS:-androiddebugkey}"
            echo "storePassword=${CI_RELEASE_STORE_PASSWORD:-android}"
            echo "keyPassword=${CI_RELEASE_KEY_PASSWORD:-android}"
          } > local.properties

      - name: Cache source-built native libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/fongmi-libmpv
            ~/.gradle/caches/fongmi-ffmpeg-${{ matrix.abi }}
            ~/.gradle/caches/fongmi-dav1d
          key: native-${{ matrix.abi }}-${{ runner.os }}-${{ hashFiles('media3compat/scripts/*.sh', 'media3compat/build.gradle') }}
          restore-keys: |
            native-all-abis-${{ runner.os }}-

      - name: Verify no APK binary dependency
        run: |
          ! grep -R -E 'FongMi/Release|releases/download/.+\\.apk|zipTree\\(.+apk' \
            media3compat app/build.gradle

      - name: Build customized Media3 API from source
        run: |
          git clone --filter=blob:none https://github.com/FongMi/media.git "$RUNNER_TEMP/media"
          git -C "$RUNNER_TEMP/media" checkout --detach c8a183b8ca7e57f43213c55f418d89fe45965db8
          echo "sdk.dir=$ANDROID_HOME" > "$RUNNER_TEMP/media/local.properties"
          sed -i '/"org.mockito:mockito-core",/a\        "org.brotli:dec",' \
            "$RUNNER_TEMP/media/missing_aar_type_workaround.gradle"
          "$RUNNER_TEMP/media/gradlew" -p "$RUNNER_TEMP/media" \
            :lib-common:publishToMavenLocal \
            :lib-ui-danmaku:publishToMavenLocal \
            :lib-ui:publishToMavenLocal --stacktrace

      - name: Build television and mobile APKs from source
        run: |
          ./gradlew \
            :app:assembleLeanback${{ matrix.flavor }}Release \
            :app:assembleMobile${{ matrix.flavor }}Release --stacktrace

      - name: Verify source-built player libraries
        run: |
          test -f media3compat/build/generated/av1/java/androidx/media3/decoder/av1/Libdav1dVideoRenderer.java
          for mode in leanback mobile; do
            apk="app/build/outputs/apk/${mode}${{ matrix.flavor }}/release/${mode}-${{ matrix.apk_abi }}.apk"
            test -f "$apk"
            unzip -l "$apk" | grep -q "lib/${{ matrix.abi }}/libdav1dJNI.so"
            unzip -l "$apk" | grep -q "lib/${{ matrix.abi }}/libmpv.so"
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.apk_abi }}
          path: app/build/outputs/apk/*${{ matrix.flavor }}/release/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: |
          find . -mindepth 2 -type f -name '*.apk' -exec mv -t . {} +
          test "$(find . -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 6
          sha256sum *.apk | sort -k2 > SHA256SUMS
          test -s SHA256SUMS
      - name: Resolve release tag
        run: |
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "RELEASE_TAG=${{ github.event.inputs.release_tag }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=v0.0.0-manual.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: release-assets/*
