name: Source-built player Android release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    branches: [fongmi]

permissions:
  contents: write

jobs:
  all-platforms:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      FONGMI_NATIVE_ABIS: arm64-v8a,armeabi-v7a,x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: chaquo/requirements.txt

      - uses: android-actions/setup-android@v3

      - name: Install Android native toolchains
        run: sdkmanager "ndk;26.1.10909125" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Configure CI release signing
        run: |
          keytool -genkeypair -noprompt \
            -keystore app/ci-release.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey -dname "CN=CI" \
            -keyalg RSA -keysize 2048 -validity 10000
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "storeFile=ci-release.keystore"
            echo "keyAlias=androiddebugkey"
            echo "storePassword=android"
            echo "keyPassword=android"
          } > local.properties

      - name: Cache source-built native libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/fongmi-libmpv
            ~/.gradle/caches/fongmi-ffmpeg-arm64-v8a
            ~/.gradle/caches/fongmi-ffmpeg-armeabi-v7a
            ~/.gradle/caches/fongmi-ffmpeg-x86_64
            ~/.gradle/caches/fongmi-dav1d
          key: native-all-abis-${{ runner.os }}-${{ hashFiles('media3compat/scripts/*.sh', 'media3compat/build.gradle') }}

      - name: Verify no APK binary dependency
        run: |
          ! grep -R -E 'FongMi/Release|releases/download/.+\\.apk|zipTree\\(.+apk' \
            media3compat app/build.gradle

      - name: Build customized Media3 API from source
        run: |
          git clone --filter=blob:none https://github.com/FongMi/media.git "$RUNNER_TEMP/media"
          git -C "$RUNNER_TEMP/media" checkout --detach c8a183b8ca7e57f43213c55f418d89fe45965db8
          echo "sdk.dir=$ANDROID_HOME" > "$RUNNER_TEMP/media/local.properties"
          sed -i '/"org.mockito:mockito-core",/a\        "org.brotli:dec",' \
            "$RUNNER_TEMP/media/missing_aar_type_workaround.gradle"
          "$RUNNER_TEMP/media/gradlew" -p "$RUNNER_TEMP/media" \
            :lib-common:publishToMavenLocal \
            :lib-ui-danmaku:publishToMavenLocal \
            :lib-ui:publishToMavenLocal --stacktrace

      - name: Build all release APKs from source
        run: |
          ./gradlew \
            :app:assembleLeanbackArm64_v8aRelease \
            :app:assembleLeanbackArmeabi_v7aRelease \
            :app:assembleLeanbackX86_64Release \
            :app:assembleMobileArm64_v8aRelease \
            :app:assembleMobileArmeabi_v7aRelease \
            :app:assembleMobileX86_64Release --stacktrace

      - name: Verify source-built AV1 extension and APK matrix
        run: |
          test -f media3compat/build/generated/av1/java/androidx/media3/decoder/av1/Libdav1dVideoRenderer.java
          for abi in arm64-v8a armeabi-v7a x86_64; do
            apk_abi=${abi//-/_}
            for mode in leanback mobile; do
              apk="app/build/outputs/apk/${mode}${apk_abi^}/release/${mode}-${apk_abi}.apk"
              test -f "$apk"
              unzip -l "$apk" | grep -q "lib/$abi/libdav1dJNI.so"
              unzip -l "$apk" | grep -q "lib/$abi/libmpv.so"
            done
          done
          cd app/build/outputs/apk
          find . -path '*/release/*.apk' -type f -print0 |
            sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: all-platform-source-release
          path: |
            app/build/outputs/apk/*/release/*.apk
            app/build/outputs/apk/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/*/release/*.apk
            app/build/outputs/apk/SHA256SUMS
