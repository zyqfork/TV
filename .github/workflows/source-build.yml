name: Source-built player Android release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    branches: [fongmi]

permissions:
  contents: write

jobs:
  signing:
    runs-on: ubuntu-24.04
    steps:
      - name: Create shared CI release key
        env:
          CI_RELEASE_KEYSTORE_BASE64: ${{ secrets.CI_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$CI_RELEASE_KEYSTORE_BASE64" ]; then
            printf '%s' "$CI_RELEASE_KEYSTORE_BASE64" | base64 --decode > ci-release.keystore
          else
            keytool -genkeypair -noprompt \
              -keystore ci-release.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey -dname "CN=CI" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ci-release-signing
          path: ci-release.keystore
          retention-days: 1

  build:
    needs: signing
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            flavor: Arm64_v8a
            apk_abi: arm64_v8a
          - abi: armeabi-v7a
            flavor: Armeabi_v7a
            apk_abi: armeabi_v7a
    env:
      FONGMI_NATIVE_ABIS: ${{ matrix.abi }}
      CI_RELEASE_STORE_PASSWORD: ${{ secrets.CI_RELEASE_STORE_PASSWORD }}
      CI_RELEASE_KEY_ALIAS: ${{ secrets.CI_RELEASE_KEY_ALIAS }}
      CI_RELEASE_KEY_PASSWORD: ${{ secrets.CI_RELEASE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          # airplay third_party: libplist + ffmpeg are git submodules required by CMake
          submodules: recursive

      # The in-app updater compares its own VERSION_NAME/VERSION_CODE against the release tag.
      # Without this stamp an installed v5.5.8-source.2 build reports VERSION_NAME=5.5.8, so every
      # "-source.N" tag would look newer forever and the update dialog would return after install.
      # gradle.properties is intentionally absent from the Gradle cache key, so this is cache-safe.
      - name: Stamp version from release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          base="${tag%%-*}"
          IFS=. read -r major minor patch <<< "$base"
          major="${major:-0}"; minor="${minor:-0}"; patch="${patch:-0}"
          case "${major}${minor}${patch}" in
            '' | *[!0-9]*) echo "Tag ${GITHUB_REF_NAME} has no numeric X.Y.Z version; keeping gradle.properties"; exit 0 ;;
          esac
          code=$(( major * 100 + minor * 10 + patch ))
          if [ "$code" -le 0 ]; then
            echo "Tag ${GITHUB_REF_NAME} parses to VERSION_CODE=${code}; keeping gradle.properties"
            exit 0
          fi
          sed -i "s|^VERSION_CODE=.*|VERSION_CODE=${code}|" gradle.properties
          sed -i "s|^VERSION_NAME=.*|VERSION_NAME=${tag}|" gradle.properties
          grep -n '^VERSION_' gradle.properties

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: chaquo/requirements.txt

      # setup-java cache:gradle snapshots all of ~/.gradle/caches (including the
      # 1.3 GB fongmi-native dirs also cached below) and hashes every *.gradle*
      # file, so a version-only bump evicts a 2–3 GB entry. Cache dependency
      # downloads only, and keep gradle.properties out of the key so VERSION_*
      # bumps do not invalidate it.
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-3
            ~/.gradle/caches/journal-1
          key: gradle-deps-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/wrapper/gradle-wrapper.jar') }}
          restore-keys: |
            gradle-deps-${{ runner.os }}-

      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      # NDK/CMake are intentionally not cached: two NDKs are 2–5 GB and only
      # save ~20–40s, which would evict the far more valuable native-libs cache
      # under the repo's 10 GB Actions cache quota.
      - name: Install Android native toolchains
        run: sdkmanager "ndk;26.1.10909125" "ndk;29.0.14206865" "cmake;3.22.1"

      - uses: actions/download-artifact@v4
        with:
          name: ci-release-signing
          path: app

      - name: Configure CI release signing
        run: |
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "storeFile=ci-release.keystore"
            echo "keyAlias=${CI_RELEASE_KEY_ALIAS:-androiddebugkey}"
            echo "storePassword=${CI_RELEASE_STORE_PASSWORD:-android}"
            echo "keyPassword=${CI_RELEASE_KEY_PASSWORD:-android}"
          } > local.properties

      - name: Cache source-built native libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/fongmi-libmpv
            ~/.gradle/caches/fongmi-ffmpeg-${{ matrix.abi }}
            ~/.gradle/caches/fongmi-dav1d
          # Exclude app/build.gradle etc. so Java-only edits do not rebuild FFmpeg/mpv.
          key: native-${{ matrix.abi }}-${{ runner.os }}-${{ hashFiles('media3compat/scripts/*.sh', 'media3compat/build.gradle') }}
          restore-keys: |
            native-${{ matrix.abi }}-${{ runner.os }}-
            native-all-abis-${{ runner.os }}-

      - name: Cache customized Media3 Maven local
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: media3-maven-${{ runner.os }}-c8a183b8ca7e57f43213c55f418d89fe45965db8
          restore-keys: |
            media3-maven-${{ runner.os }}-

      - name: Verify no APK binary dependency
        run: |
          ! grep -R -E 'FongMi/Release|releases/download/.+\\.apk|zipTree\\(.+apk' \
            media3compat app/build.gradle

      - name: Build customized Media3 API from source
        run: |
          if [ -d "$HOME/.m2/repository/androidx/media3" ] && [ -f "$HOME/.m2/repository/.media3-c8a183b8.stamp" ]; then
            echo "Reusing cached Media3 Maven local artifacts"
            exit 0
          fi
          rm -rf "$HOME/.m2/repository/androidx/media3"
          git clone --filter=blob:none https://github.com/FongMi/media.git "$RUNNER_TEMP/media"
          git -C "$RUNNER_TEMP/media" checkout --detach c8a183b8ca7e57f43213c55f418d89fe45965db8
          echo "sdk.dir=$ANDROID_HOME" > "$RUNNER_TEMP/media/local.properties"
          sed -i '/"org.mockito:mockito-core",/a\        "org.brotli:dec",' \
            "$RUNNER_TEMP/media/missing_aar_type_workaround.gradle"
          "$RUNNER_TEMP/media/gradlew" -p "$RUNNER_TEMP/media" \
            :lib-common:publishToMavenLocal \
            :lib-ui-danmaku:publishToMavenLocal \
            :lib-ui:publishToMavenLocal --stacktrace
          touch "$HOME/.m2/repository/.media3-c8a183b8.stamp"

      - name: Build television and mobile APKs from source
        env:
          # APK packaging reads large, uncompressed native libraries into the Gradle heap.
          # arm64 libmpv/ffmpeg/airplay .so files exceed the 2–4 GiB default on hosted runners.
          CI_GRADLE_JVMARGS: -Xmx8192m -Dfile.encoding=UTF-8 --add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED
        run: |
          # gradle.properties still pins 2 GiB; override it so the single-use daemon
          # (and in-process packaging workers) inherit the larger CI heap.
          # '|' delimiter: jvmargs contain '/' in --add-exports paths.
          sed -i 's|^org\.gradle\.jvmargs=.*|org.gradle.jvmargs='"$CI_GRADLE_JVMARGS"'|' gradle.properties
          grep -n 'org.gradle.jvmargs' gradle.properties
          # Separate invocations prevent two 80+ MiB APK packaging workers from peaking together.
          ./gradlew \
            :app:assembleLeanback${{ matrix.flavor }}Release \
            --stacktrace --max-workers=2 --no-daemon \
            -Dorg.gradle.jvmargs="$CI_GRADLE_JVMARGS"
          ./gradlew \
            :app:assembleMobile${{ matrix.flavor }}Release \
            --stacktrace --max-workers=2 --no-daemon \
            -Dorg.gradle.jvmargs="$CI_GRADLE_JVMARGS"

      - name: Verify source-built player libraries
        run: |
          test -f media3compat/build/generated/av1/java/androidx/media3/decoder/av1/Libdav1dVideoRenderer.java
          for mode in leanback mobile; do
            apk="app/build/outputs/apk/${mode}${{ matrix.flavor }}/release/${mode}-${{ matrix.apk_abi }}.apk"
            test -f "$apk"
            unzip -l "$apk" | grep -q "lib/${{ matrix.abi }}/libdav1dJNI.so"
            unzip -l "$apk" | grep -q "lib/${{ matrix.abi }}/libmpv.so"
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.apk_abi }}
          path: app/build/outputs/apk/*${{ matrix.flavor }}/release/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        working-directory: release-assets
        run: |
          find . -mindepth 2 -type f -name '*.apk' -exec mv -t . {} +
          test "$(find . -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 4
          sha256sum *.apk | sort -k2 > SHA256SUMS
          test -s SHA256SUMS
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
