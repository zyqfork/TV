name: Source-only Android build

on:
  workflow_dispatch:
  push:
    branches: [fongmi]
  pull_request:
    branches: [fongmi]

permissions:
  contents: read

jobs:
  leanback-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      FONGMI_NATIVE_ABIS: arm64-v8a

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: chaquo/requirements.txt

      - uses: android-actions/setup-android@v3

      - name: Install Android native toolchains
        run: sdkmanager "ndk;26.1.10909125" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Configure CI release signing
        run: |
          keytool -genkeypair -noprompt \
            -keystore app/ci-release.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey -dname "CN=CI" \
            -keyalg RSA -keysize 2048 -validity 10000
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "storeFile=ci-release.keystore"
            echo "keyAlias=androiddebugkey"
            echo "storePassword=android"
            echo "keyPassword=android"
          } > local.properties

      - name: Cache source-built native libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/fongmi-libmpv
            ~/.gradle/caches/fongmi-ffmpeg-arm64-v8a
            ~/.gradle/caches/fongmi-dav1d
          key: native-arm64-${{ runner.os }}-${{ hashFiles('media3compat/scripts/*.sh', 'media3compat/build.gradle') }}

      - name: Verify no APK binary dependency
        run: |
          ! grep -R -E 'FongMi/Release|releases/download/.+\\.apk|zipTree\\(.+apk' \
            media3compat app/build.gradle

      - name: Build customized Media3 API from source
        run: |
          git clone --filter=blob:none https://github.com/FongMi/media.git "$RUNNER_TEMP/media"
          git -C "$RUNNER_TEMP/media" checkout --detach c8a183b8ca7e57f43213c55f418d89fe45965db8
          echo "sdk.dir=$ANDROID_HOME" > "$RUNNER_TEMP/media/local.properties"
          "$RUNNER_TEMP/media/gradlew" -p "$RUNNER_TEMP/media" \
            :lib-common:publishToMavenLocal --stacktrace

      - name: Build release APK from source
        run: ./gradlew :app:assembleLeanbackArm64_v8aRelease --stacktrace

      - name: Verify source-built AV1 extension
        run: |
          test -f media3compat/build/generated/av1/java/androidx/media3/decoder/av1/Libdav1dVideoRenderer.java
          unzip -l app/build/outputs/apk/leanbackArm64_v8a/release/*.apk |
            grep -q 'lib/arm64-v8a/libdav1dJNI.so'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: leanback-arm64-source-release
          path: app/build/outputs/apk/leanbackArm64_v8a/release/*.apk
          if-no-files-found: error
